name: table

# Pull requests and pushes: validate the review files only (no write access).
# Push to main: regenerate TABLE.md and commit it, so no agent ever edits TABLE.md and it never conflicts.
on:
  pull_request:
    paths:
      - "reviews/**"
      - "build_table.py"
  push:
    branches: [main]
    paths:
      - "reviews/**"
      - "build_table.py"

permissions: {}

concurrency:
  group: table-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I build_table.py --check

  render:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - run: python3 -I build_table.py
      - name: Commit TABLE.md when it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TABLE.md
          if ! git diff --cached --quiet; then
            git commit -m 'table: regenerate [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
